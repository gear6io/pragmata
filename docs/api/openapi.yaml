openapi: 3.0.3
info:
  title: Pragmata API
  version: v0
paths:
  /api/v0/pipes:
    get:
      description: ""
      operationId: listPipes
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/PipetypesPipe'
                    nullable: true
                    type: array
                  status:
                    type: string
                type: object
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List all pipes
      tags:
      - pipes
    post:
      description: ""
      operationId: createPipe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipetypesPostablePipe'
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/PipetypesPipe'
                  status:
                    type: string
                type: object
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create a pipe
      tags:
      - pipes
  /api/v0/pipes/{name}:
    delete:
      description: ""
      operationId: deletePipe
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete a pipe
      tags:
      - pipes
    put:
      description: ""
      operationId: updatePipe
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipetypesPostablePipe'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/PipetypesPipe'
                  status:
                    type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update a pipe
      tags:
      - pipes
  /api/v0/pipes/{name}/meta:
    get:
      description: ""
      operationId: getPipe
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/PipetypesPipe'
                  status:
                    type: string
                type: object
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get pipe metadata
      tags:
      - pipes
  /api/v0/sources:
    get:
      description: ""
      operationId: listSources
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/SourcetypesSource'
                    nullable: true
                    type: array
                  status:
                    type: string
                type: object
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List all sources
      tags:
      - sources
    post:
      description: ""
      operationId: createSource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourcetypesSource'
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/SourcetypesSource'
                  status:
                    type: string
                type: object
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create a source
      tags:
      - sources
  /api/v0/sources/{name}:
    get:
      description: ""
      operationId: getSource
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/SourcetypesSource'
                  status:
                    type: string
                type: object
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get source with fields
      tags:
      - sources
  /api/v0/suggestions:
    post:
      description: ""
      operationId: getSuggestions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestiontypesSuggestionRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/SuggestiontypesSuggestionResponse'
                  status:
                    type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get autocomplete suggestions
      tags:
      - suggestions
components:
  schemas:
    PipetypesPipe:
      properties:
        content:
          type: string
        copySchedule:
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        datasource:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        tags:
          $ref: '#/components/schemas/PipetypesTags'
        targetDatasource:
          type: string
        type:
          type: string
        updatedAt:
          format: date-time
          type: string
        updatedBy:
          type: string
      required:
      - id
      type: object
    PipetypesPostablePipe:
      properties:
        content:
          type: string
      type: object
    PipetypesTags:
      items:
        type: string
      type: array
    QuerybuildertypesField:
      properties:
        name:
          type: string
        type:
          type: string
      type: object
    RenderErrorResponse:
      properties:
        error:
          type: string
        status:
          type: string
      type: object
    SourcetypesSource:
      properties:
        engine:
          type: string
        fields:
          items:
            $ref: '#/components/schemas/QuerybuildertypesField'
          type: array
        name:
          type: string
      type: object
    SuggestiontypesSuggestion:
      properties:
        detail:
          type: string
        kind:
          type: string
        label:
          type: string
        value:
          type: string
      type: object
    SuggestiontypesSuggestionRequest:
      properties:
        contextType:
          type: string
        matchingType:
          type: string
        nodeRef:
          type: string
        pipeContent:
          type: string
        searchText:
          type: string
      type: object
    SuggestiontypesSuggestionResponse:
      properties:
        complete:
          type: boolean
        suggestions:
          items:
            $ref: '#/components/schemas/SuggestiontypesSuggestion'
          nullable: true
          type: array
      type: object
  securitySchemes:
    BearerAuth:
      description: API bearer token
      scheme: bearer
      type: http
